</button>

<script>
(function () {
  const button = document.getElementById("theme-toggle");
  const root = document.documentElement;
  const icon = button.querySelector(".theme-toggle-icon");

  function applyTheme(theme) {
    root.setAttribute("data-theme", theme);
    icon.textContent = theme === "dark" ? "☀" : "☾";

    button.setAttribute(
      "aria-label",
      theme === "dark"
        ? "Switch to light mode"
        : "Switch to dark mode"
    );
  }

  const savedTheme = localStorage.getItem("theme");

  if (savedTheme === "dark" || savedTheme === "light") {
    applyTheme(savedTheme);
  } else {
    const prefersDark =
      window.matchMedia &&
      window.matchMedia("(prefers-color-scheme: dark)").matches;

    applyTheme(prefersDark ? "dark" : "light");
  }

  button.addEventListener("click", function () {
    const current =
      root.getAttribute("data-theme") === "dark"
        ? "dark"
        : "light";

    const next = current === "dark" ? "light" : "dark";

    localStorage.setItem("theme", next);
    applyTheme(next);
  });
})();
</script>

<script>
(function () {
  var root = document.documentElement;

  var FONT_STEPS = [0.9, 1, 1.1, 1.2, 1.3];
  var DEFAULT_STEP_INDEX = 1; // 1 = 100%

  var toggle = document.getElementById("reader-tools-toggle");
  var panel = document.getElementById("reader-tools-panel");
  var decreaseBtn = document.getElementById("reader-font-decrease");
  var increaseBtn = document.getElementById("reader-font-increase");
  var resetBtn = document.getElementById("reader-font-reset");
  var relaxedCheckbox = document.getElementById("reader-relaxed-spacing");
  var underlineCheckbox = document.getElementById("reader-underline-links");

  function readStoredIndex() {
    var raw = localStorage.getItem("readerFontStepIndex");
    var index = raw === null ? DEFAULT_STEP_INDEX : parseInt(raw, 10);

    if (isNaN(index) || index < 0 || index >= FONT_STEPS.length) {
      index = DEFAULT_STEP_INDEX;
    }

    return index;
  }

  function applyFontStep(index) {
    root.style.setProperty("--reader-scale", String(FONT_STEPS[index]));
    localStorage.setItem("readerFontStepIndex", String(index));

    decreaseBtn.disabled = index === 0;
    increaseBtn.disabled = index === FONT_STEPS.length - 1;
  }

  function applyRelaxedSpacing(enabled) {
    root.classList.toggle("reading-relaxed", enabled);
    localStorage.setItem("readerRelaxedSpacing", enabled ? "1" : "0");
    relaxedCheckbox.checked = enabled;
  }

  function applyUnderlineLinks(enabled) {
    root.classList.toggle("reading-underline-links", enabled);
    localStorage.setItem("readerUnderlineLinks", enabled ? "1" : "0");
    underlineCheckbox.checked = enabled;
  }

  // Restore saved preferences on load.
  var currentIndex = readStoredIndex();
  applyFontStep(currentIndex);
  applyRelaxedSpacing(localStorage.getItem("readerRelaxedSpacing") === "1");
  applyUnderlineLinks(localStorage.getItem("readerUnderlineLinks") === "1");

  toggle.addEventListener("click", function () {
    var isOpen = !panel.hidden;
    panel.hidden = isOpen;
    toggle.setAttribute("aria-expanded", String(!isOpen));
  });

  document.addEventListener("click", function (event) {
    if (!panel.hidden && !panel.contains(event.target) && event.target !== toggle) {
      panel.hidden = true;
      toggle.setAttribute("aria-expanded", "false");
    }
  });

  decreaseBtn.addEventListener("click", function () {
    currentIndex = Math.max(0, currentIndex - 1);
    applyFontStep(currentIndex);
  });

  increaseBtn.addEventListener("click", function () {
    currentIndex = Math.min(FONT_STEPS.length - 1, currentIndex + 1);
    applyFontStep(currentIndex);
  });

  resetBtn.addEventListener("click", function () {
    currentIndex = DEFAULT_STEP_INDEX;
    applyFontStep(currentIndex);
    applyRelaxedSpacing(false);
    applyUnderlineLinks(false);
  });

  relaxedCheckbox.addEventListener("change", function () {
    applyRelaxedSpacing(relaxedCheckbox.checked);
  });

  underlineCheckbox.addEventListener("change", function () {
    applyUnderlineLinks(underlineCheckbox.checked);
  });
})();
</script>
